<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Upload</title>
</head>
<body>
    <header><H1>SongArchive</H1></header>
    <main>
        <div>
            <input type="text" id="song" placeholder="Song Name">
            <input type="text" id="artist" placeholder="Song Artist">
            <input type="number" id="duration" placeholder="Song Duration">
            <button id="upload">Upload Musics</button>
        </div>
        <div>
            <input type="file" id="musicArchive">
        </div>
        <p id="message"></p>

    </main>
    <footer>Upload your favorites songs</footer>

    <script type="module" src="../Js/admin.js"></script>
</body>
</html>
